<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        button{
            width: 100%;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            margin-bottom: 20px;
            border-radius: 999px;
            cursor: pointer;
            background-color: #0d6efd;
            color: white;
        }
        button:hover{
            background-color: #0b5ed7;
        }
        form{
            width: 300px;
            text-align: center;
        }
        form h1{
            font-size: 28px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        input[type="email"], 
        input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group input::placeholder {
            color: #999;
        }
        .form-group input:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 3px #b9d3fa;
            outline: none;
        }
        .remember-me {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            gap: 6px;
            margin-bottom: 16px;
        }
        footer {
            font-size: 13px;
            color: #6c757d;
    }

    </style>
</head>
<body>
    <form>
        <h1>Please Sign In</h1>
        <div class = "form-group">
        <input type="email" placeholder="Email address" name="email" required>
        </div>
        <div class = "form-group">
        <input type="password" placeholder="Password" name="password" required>
        </div>
        <label class="remember-me">
            <input type="checkbox" name="remember"> Remember me
        </label>
        
        <button type="submit">Sign In</button>
        
        <footer>Copyright &copy; 2020</footer>
    </form>
</body>
</html>
